[package]
name = "egui-android-text-actions-tests"
version = "0.0.0"
edition = "2024"
publish = false

# Test the production widget without Android-only android-activity/eframe dependencies.
[workspace]

[dependencies]
# Bundles NotoEmoji and emoji-icon-font for the toolbar emoji.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }

[lib]
path = "../../crates/egui-android/src/text_actions.rs"

[lints.rust]
dead_code = "allow"
