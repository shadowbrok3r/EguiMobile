<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Launcher icon: a voice waveform resolving into lines of text, on the near-black tile the
       other apps in this repo use. Rasterized by scripts/render-icons.sh examples/scribe-android. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a2a"/>
      <stop offset="1" stop-color="#06070c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.34" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="voice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="192" height="192" rx="42" fill="url(#tile)"/>
  <rect x="0" y="0" width="192" height="192" rx="42" fill="url(#glow)"/>

  <!-- The voice: five bars of a waveform. -->
  <g fill="url(#voice)">
    <rect x="34" y="80" width="11" height="32" rx="5.5"/>
    <rect x="51" y="58" width="11" height="76" rx="5.5"/>
    <rect x="68" y="40" width="11" height="112" rx="5.5"/>
    <rect x="85" y="64" width="11" height="64" rx="5.5"/>
    <rect x="102" y="84" width="11" height="24" rx="5.5"/>
  </g>

  <!-- The note it becomes: three lines of text. -->
  <g fill="#eef6ff">
    <rect x="124" y="66" width="38" height="10" rx="5"/>
    <rect x="124" y="91" width="38" height="10" rx="5" fill-opacity="0.82"/>
    <rect x="124" y="116" width="24" height="10" rx="5" fill-opacity="0.62"/>
  </g>
</svg>
