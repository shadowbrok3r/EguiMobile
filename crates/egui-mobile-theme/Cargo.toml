[package]
name = "egui-mobile-theme"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared Mastertech palette and desktop/touch metrics for egui applications"

[dependencies]
egui-theme-kit = { git = "https://github.com/shadowbrok3r/egui-theme-kit", rev = "09d1e793076357ec5d86df7e1d6771d0306f2e70", default-features = false, features = ["controls", "picker"] }

# The preset kit uses eframe types. Host tools/tests need a desktop backend;
# Android and iOS keep their existing native platform configuration.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland"] }
